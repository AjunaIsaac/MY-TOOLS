<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Bridge Pro | StreamZone</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root { 
            --primary-bg: #0A0F2A; 
            --card-bg: #1C2141; 
            --accent-color: #DFFF00; 
            --text-primary: #FFFFFF; 
            --text-secondary: #a9a9b3; 
            --input-bg: #0E1225; 
            --success-color: #27ae60; 
            --danger-color: #e74c3c; 
            --border-color: #33395b; 
        }

        body { background-color: var(--primary-bg); color: var(--text-primary); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: var(--accent-color); text-align: center; margin-bottom: 25px; letter-spacing: 2px; font-weight: 800; font-size: 28px; }
        
        .tabs { display: flex; justify-content: space-around; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; position: sticky; top: 0; background: var(--primary-bg); z-index: 10; }
        .tab-button { padding: 15px 5px; cursor: pointer; background: none; border: none; color: var(--text-secondary); font-weight: bold; font-size: 13px; transition: 0.3s; flex: 1; text-align: center; }
        .tab-button.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .input-field, textarea, select { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; outline: none; }
        .input-field:focus { border-color: var(--accent-color); }
        .action-button { background: linear-gradient(90deg, #FF416C, #FFDE00); color: #000; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
        .btn-secondary { background: #1c2141; color: white; width: auto; font-size: 12px; border: 1px solid var(--border-color); margin-right: 5px; cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        
        .message { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: center; font-weight: bold; font-size: 13px; }
        .message.show { display: block; }
        .message.success { background: rgba(39, 174, 96, 0.15); color: var(--success-color); border: 1px solid var(--success-color); }
        .message.error { background: rgba(231, 76, 60, 0.15); color: var(--danger-color); border: 1px solid var(--danger-color); }

        /* --- THE GRID (MOBILE OPTIMIZED: 3 COLUMNS) --- */
        #browse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        @media (max-width: 600px) {
            #browse-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .browse-card-title { font-size: 10px !important; padding: 5px !important; }
            h1 { font-size: 20px; }
            .tab-button { font-size: 11px; }
        }

        .browse-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .browse-card:hover { border-color: var(--accent-color); transform: translateY(-3px); }
        .browse-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #000; }
        .browse-card-title { padding: 8px; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .browse-card-year { font-size: 10px; color: var(--accent-color); text-align: center; padding-bottom: 5px; font-weight: bold; opacity: 0.8; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; max-height: 200px; overflow-y: auto; background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .checkbox-label { display: flex; align-items: center; gap: 5px; background: #1a2035; padding: 5px 10px; border-radius: 20px; font-size: 10px; cursor: pointer; border: 1px solid #33395b; }
        .checkbox-label input:checked + span { color: var(--accent-color); font-weight: bold; }

        .spinner { border: 3px solid rgba(255,255,255,.3); border-top: 3px solid #fff; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        pre { background: #000 !important; border-radius: 8px; padding: 15px !important; font-size: 11px; border: 1px solid #333; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>MEDIA BRIDGE <span style="font-weight: 300; font-size: 14px; vertical-align: middle; opacity: 0.7;">PRO</span></h1>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab(event, 'tab-browse')">1. BROWSE</button>
        <button class="tab-button" onclick="openTab(event, 'tab-scrape')">2. SCRAPE</button>
        <button class="tab-button" onclick="openTab(event, 'tab-save')">3. SAVE</button>
    </div>

    <div id="status-message" class="message"></div>

    <!-- TAB 1: BROWSE -->
    <div id="tab-browse" class="tab-content active">
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <select id="search-type" class="input-field" style="width:100px; margin-bottom:0;">
                <option value="movies">Movies</option>
                <option value="series">Series</option>
            </select>
            <input type="text" id="search-input" class="input-field" placeholder="Search title..." style="margin-bottom:0">
            <button onclick="loadContent('search', document.getElementById('search-input').value)" class="action-button" style="width:80px">GO</button>
        </div>
        <div style="margin-bottom:15px; display: flex; justify-content: center; gap: 10px;">
            <button class="btn-secondary" onclick="loadContent('browse', 'series')">TV SHOWS</button>
            <button class="btn-secondary" onclick="loadContent('browse', 'movies')">MOVIES</button>
        </div>
        <div id="browse-grid"></div>
    </div>

    <!-- TAB 2: SCRAPE -->
    <div id="tab-scrape" class="tab-content">
        <div style="background: rgba(223, 255, 0, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--accent-color);">
            <p style="margin:0; font-size: 12px; color: var(--accent-color);">⚡ <b>Auto-Login Active:</b> <u>ajunaisaaconline@gmail.com</u></p>
        </div>
        <label style="font-size: 12px; opacity: 0.7;">Target URL:</label>
        <input type="text" id="scrape-url-input" class="input-field" placeholder="https://zflix.click/...">
        <button id="scrape-btn" class="action-button" onclick="handleScrape(this)">START SCRAPE</button>
        <pre style="margin-top:20px"><code class="language-json" id="output-data">{}</code></pre>
    </div>

    <!-- TAB 3: SAVE -->
    <div id="tab-save" class="tab-content">
        <div style="margin-bottom:20px; background: #141933; padding: 15px; border-radius: 8px; border: 1px solid #33395b;">
            <label style="font-size: 12px; font-weight: bold; color: var(--accent-color);">TMDB METADATA SYNC (Select Year)</label>
            <div style="display:flex; gap:8px; margin-top:5px;">
                <input type="text" id="tmdb-search-query" class="input-field" style="margin-bottom:0">
                <button id="tmdb-search-btn" class="btn-secondary" style="margin:0">SEARCH</button>
            </div>
            <div id="tmdb-results" style="display:flex; gap:12px; overflow-x:auto; padding-top:15px; padding-bottom:5px;"></div>
        </div>

        <form id="db-form">
            <input type="hidden" id="db_tmdb_id"><input type="hidden" id="db_poster"><input type="hidden" id="db_backdrop"><input type="hidden" id="db_year">
            <label>Final Title:</label><input type="text" id="db_title" class="input-field" required>
            <label>Plot:</label><textarea id="db_description" class="input-field" rows="3"></textarea>
            <div id="movie_stream_link_group" style="display:none"><label>Stream Link:</label><input type="text" id="db_stream_link" class="input-field"></div>
            <div id="series_episodes_group" style="display:none"><label>Episodes JSON:</label><textarea id="db_episodes_json" class="input-field" rows="6" style="font-family: monospace; font-size: 11px;"></textarea></div>
            <label>VJ Selector:</label><div id="vj-container" class="checkbox-group"></div>
            <label>Genres (Auto-Selected from TMDB):</label><div id="genre-container" class="checkbox-group"></div>
            <label>App Tags:</label><div id="tag-container" class="checkbox-group"></div>
            <button type="submit" id="save-db-btn" class="action-button">SAVE TO DATABASE</button>
            <div id="db-form-message" class="message" style="margin-top:10px"></div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pocketbase@latest/dist/pocketbase.umd.js"></script>
<script>
    const SCRAPER_URL = 'https://scraper.streamzonemovies.online';
    const PB_URL = 'https://db.streamzonemovies.online';
    const TMDB_API_KEY = "f7a3b097ba7a990fd0c8ef3147646fb5";
    const pb = new PocketBase(PB_URL);
    pb.autoCancellation(false);

    const elements = {
        statusMessage: document.getElementById('status-message'),
        outputData: document.getElementById('output-data'),
        urlInput: document.getElementById('scrape-url-input'),
        browseGrid: document.getElementById('browse-grid'),
        dbForm: document.getElementById('db-form'),
        dbFormMessage: document.getElementById('db-form-message'),
        saveDbBtn: document.getElementById('save-db-btn'),
        tmdbSearchQuery: document.getElementById('tmdb-search-query'),
        tmdbResults: document.getElementById('tmdb-results'),
        movieGroup: document.getElementById('movie_stream_link_group'),
        seriesGroup: document.getElementById('series_episodes_group'),
        searchInput: document.getElementById('search-input'),
        searchType: document.getElementById('search-type')
    };

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        if (evt) evt.currentTarget.classList.add('active');
        else document.querySelector(`.tab-button[onclick*="'${tabName}'"]`).classList.add('active');
    }

    function showMsg(type, text, el = elements.statusMessage) {
        el.className = `message ${type} show`;
        el.textContent = text;
        setTimeout(() => el.classList.remove('show'), 5000);
    }

    // --- TAB 1: BROWSE ---
    async function loadContent(action, value) {
        if (!value && action === 'search') return;
        let url = (action === 'browse') 
            ? `https://zflix.click/${value}` 
            : `https://zflix.click/${elements.searchType.value}?search=${encodeURIComponent(value.trim())}`;
        elements.browseGrid.innerHTML = '<div style="padding:20px;"><span class="spinner"></span> Working...</div>';
        try {
            const res = await fetch(`${SCRAPER_URL}/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            elements.browseGrid.innerHTML = data.items.map(i => `<div class="browse-card" onclick="selectItem('${i.watchUrl}')"><img src="${i.imageUrl || 'https://via.placeholder.com/150x225?text=No+Poster'}"><div class="browse-card-title">${i.title}</div></div>`).join('');
        } catch (err) { elements.browseGrid.innerHTML = `<p style="color:red; padding:10px;">Error: ${err.message}</p>`; }
    }

    function selectItem(url) {
        if (url.includes('/shows/watch/')) url = url.replace('/shows/watch/', '/shows/details/');
        if (url.includes('/movies/details/')) url = url.replace('/movies/details/', '/movies/watch/');
        elements.urlInput.value = url;
        openTab(null, 'tab-scrape');
        showMsg('success', 'Ready to Scrape.');
    }

    // --- TAB 2: SCRAPE ---
    async function handleScrape(btn) {
        const url = elements.urlInput.value.trim();
        if (!url) return showMsg('error', 'Paste URL first');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Extracting...';
        try {
            const res = await fetch(`${SCRAPER_URL}/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            elements.outputData.textContent = JSON.stringify(data, null, 2);
            Prism.highlightElement(elements.outputData);
            populateForm(url.includes('/shows/') ? 'series' : 'movie', data);
            showMsg('success', 'Scrape Success!');
            setTimeout(() => openTab(null, 'tab-save'), 800);
        } catch (err) { showMsg('error', err.message); } 
        finally { btn.disabled = false; btn.innerHTML = 'START SCRAPE'; }
    }

    function populateForm(type, data) {
        elements.dbForm.reset();
        const isSeries = type === 'series';
        elements.movieGroup.style.display = isSeries ? 'none' : 'block';
        elements.seriesGroup.style.display = isSeries ? 'block' : 'none';
        const clean = (isSeries ? data.seriesTitle : data.title).replace(/\s*-\s*Vj\s+.*/i, "").trim();
        document.getElementById('db_title').value = clean;
        elements.tmdbSearchQuery.value = clean;
        if (isSeries) {
            const episodes = [];
            data.seasons.forEach(s => { s.episodes.forEach(e => { episodes.push({ episode: e.episode_number, season: s.season_number, title: e.title.toUpperCase(), url: e.videoUrl }); }); });
            document.getElementById('db_episodes_json').value = JSON.stringify(episodes, null, 2);
        } else { document.getElementById('db_stream_link').value = data.videoUrl; }
        document.getElementById('tmdb-search-btn').click();
    }

    // --- TAB 3: SAVE ---
    document.getElementById('tmdb-search-btn').addEventListener('click', async () => {
        const q = elements.tmdbSearchQuery.value;
        const type = elements.seriesGroup.style.display === 'block' ? 'tv' : 'movie';
        if (!q) return;
        elements.tmdbResults.innerHTML = '<span class="spinner"></span>';
        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(q)}`);
            const d = await res.json();
            elements.tmdbResults.innerHTML = d.results.slice(0, 5).map(i => {
                const year = (i.release_date || i.first_air_date || '').split('-')[0];
                return `<div class="browse-card" style="width:100px; flex-shrink:0;" onclick="applyTmdb(${i.id}, '${type}')">
                    <img src="https://image.tmdb.org/t/p/w200${i.poster_path}" onerror="this.src='https://via.placeholder.com/100x150'">
                    <div class="browse-card-year">${year || 'N/A'}</div>
                </div>`;
            }).join('');
        } catch (e) { elements.tmdbResults.innerHTML = 'Error'; }
    });

    async function applyTmdb(id, type) {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}`);
            const d = await res.json();
            
            // Populate basic fields
            document.getElementById('db_title').value = d.title || d.name;
            document.getElementById('db_tmdb_id').value = d.id;
            document.getElementById('db_poster').value = d.poster_path ? `https://image.tmdb.org/t/p/w500${d.poster_path}` : '';
            document.getElementById('db_backdrop').value = d.backdrop_path ? `https://image.tmdb.org/t/p/original${d.backdrop_path}` : '';
            document.getElementById('db_year').value = (d.first_air_date || d.release_date || '').split('-')[0];
            document.getElementById('db_description').value = d.overview;

            // --- AUTO SELECT GENRES ---
            document.querySelectorAll('input[name="genres"]').forEach(cb => cb.checked = false);
            if (d.genres) {
                d.genres.forEach(g => {
                    let gName = g.name.toUpperCase();
                    if (gName === 'SCIENCE FICTION') gName = 'SCI FI';
                    // Mixed Mapping
                    if (gName === 'ACTION & ADVENTURE') {
                         document.querySelectorAll('input[name="genres"][value="ACTION"], input[name="genres"][value="ADVENTURE"]').forEach(c => c.checked = true);
                    }
                    const checkbox = document.querySelector(`input[name="genres"][value="${gName}"]`);
                    if (checkbox) checkbox.checked = true;
                });
            }

            showMsg('success', 'Metadata & Genres Loaded!');
        } catch (e) { showMsg('error', 'Failed to fetch details.'); }
    }

    elements.dbForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const vjs = Array.from(document.querySelectorAll('input[name="vjs"]:checked')).map(c => c.value);
        if (vjs.length === 0) return showMsg('error', 'Select VJ!');
        elements.saveDbBtn.disabled = true; elements.saveDbBtn.innerText = "SAVING...";
        try {
            const record = {
                title: document.getElementById('db_title').value, tmdb_id: document.getElementById('db_tmdb_id').value,
                description: document.getElementById('db_description').value, poster: document.getElementById('db_poster').value,
                backdrop: document.getElementById('db_backdrop').value, year: document.getElementById('db_year').value,
                vjs, genres: Array.from(document.querySelectorAll('input[name="genres"]:checked')).map(c => c.value),
                tags: Array.from(document.querySelectorAll('input[name="tags"]:checked')).map(c => c.value),
                contentType: elements.seriesGroup.style.display === 'block' ? 'tv' : 'movie'
            };
            if (record.contentType === 'tv') record.episodes = JSON.parse(document.getElementById('db_episodes_json').value);
            else record.stream_link = document.getElementById('db_stream_link').value;

            const created = await pb.collection('media').create(record);
            if (confirm(`✅ Saved to Database!\n\nDo you want to send a push notification for "${record.title}"?`)) {
                window.location.href = `manage-notifications.html?autofill_id=${created.id}`;
            } else {
                showMsg('success', 'Saved Successfully!');
                elements.dbForm.reset();
            }
        } catch (err) { showMsg('error', err.message, elements.dbFormMessage); } 
        finally { elements.saveDbBtn.disabled = false; elements.saveDbBtn.innerText = "SAVE TO DATABASE"; }
    });

    const VJS = ["VJ JUNIOR", "VJ TONNY","VJ HEAVY Q","VJ EMMY", "VJ LIGHT","VJ RYAN","VJ JOE", "VJ MK","VJ HAM", "VJ MARK", "VJ SHIELD", "VJ ISMA K","VJ MOSCO", "VJ BONNY", "VJ NEIL", "VJ JOVAN", "VJ TOM", "VJ SHAO K", "VJ JINGO", "VJ ICE P", "VJ KEVO", "VJ KEVIN", "VJ KIN", "VJ KRISS S", "VJ HD", "VJ DAN DE", "VJ SAMMY", "VJ IVO", "VJ LITTLE T", "VJ LASH", "VJ MOX", "VJ MUBA", "VJ EDDY", "VJ KAM", "VJ LANCE", "VJ KS", "VJ ULIO", "VJ AARON", "VJ CABS", "VJ BANKS", "VJ JIMMY", "VJ BAROS", "VJ SOUL", "VJ SON", "VJ KIMULI", "VJ FREDY", "VJ JUMPERS", "VJ ASHIM", "VJ PAULETA", "VJ MARTIN K", "VJ HENRICO", "VJ MUSA", "VJ UNCLE T", "VJ WAZA", "VJ RONAGE"];
    const GENRES = ["ACTION", "ADVENTURE", "ANIMATION", "COMEDY", "CRIME", "DOCUMENTARY", "DRAMA", "FAMILY", "FANTASY", "HISTORY", "HORROR", "KUNGU FU", "LOVE STORY", "MUSIC", "MYSTERY", "ROMANCE", "SCI FI", "SPORT", "THRILLER", "WAR", "WESTERN"];
    const TAGS = ["latest_uploads", "recent_movies", "most_liked", "romance", "Latest-Movies", "indian", "action-thriller", "scifi-fantasy", "high-school", "animation", "horror", "comedy", "adventure", "send_notification", "latest_tv_series"];

    function makeChecks(list, container, name) {
        document.getElementById(container).innerHTML = list.sort().map(i => `<label class="checkbox-label"><input type="checkbox" name="${name}" value="${i}" ${i==='latest_uploads'?'checked':''}> <span>${i.replace(/_/g, ' ').toUpperCase()}</span></label>`).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
        makeChecks(VJS, 'vj-container', 'vjs'); makeChecks(GENRES, 'genre-container', 'genres'); makeChecks(TAGS, 'tag-container', 'tags');
        loadContent('browse', 'series'); 
    });
    elements.searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadContent('search', elements.searchInput.value); });
</script>
</body>
</html>
