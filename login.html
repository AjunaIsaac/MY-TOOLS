<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ✅ FIX: Using specific version 0.21.5 to match your server version -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.5/pocketbase.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        :root {
            --bg-deep: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #0b6325;
            --primary-glow: rgba(223, 255, 0, 0.4);
            --text-main: #ffffff;
            --text-muted: #888888;
            --danger: #ff3b30;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-deep);
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND ANIMATION --- */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(29, 29, 65, 0.5), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(22, 40, 45, 0.5), transparent 25%);
            z-index: 1;
            animation: pulseLight 10s ease-in-out infinite alternate;
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        @keyframes pulseLight {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        /* --- LOGIN CARD --- */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--danger); }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); }
            40%, 60% { transform: translate3d(2px, 0, 0); }
        }

        /* --- HEADER --- */
        .header { text-align: center; margin-bottom: 40px; }
        .logo-ring {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .logo-ring i { font-size: 24px; color: var(--primary); }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; color: #fff; }
        p.subtitle { font-size: 0.85rem; color: var(--text-muted); }

        /* --- SLIDING FORM --- */
        .form-slider { position: relative; height: 180px; overflow: hidden; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; transform: translateX(60px); pointer-events: none;
        }
        .slide.active { opacity: 1; transform: translateX(0); pointer-events: all; }
        .slide.prev { opacity: 0; transform: translateX(-60px); }

        /* --- INPUTS --- */
        .input-box { position: relative; margin-bottom: 20px; }
        .input-box input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 16px 16px 16px 45px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }
        .input-box i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); transition: 0.3s;
        }
        .input-box input:focus {
            border-color: var(--primary);
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 0 4px rgba(223, 255, 0, 0.1);
            outline: none;
        }
        .input-box input:focus + i { color: var(--primary); }

        /* --- BUTTONS --- */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--primary-glow); }
        .btn-primary:active { transform: translateY(0); }

        .btn-link {
            background: none; border: none; color: var(--text-muted);
            font-size: 0.85rem; cursor: pointer; margin-top: 15px; width: 100%;
            transition: 0.3s;
        }
        .btn-link:hover { color: #fff; }

        /* --- USER ID CHIP --- */
        .user-chip {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 50px;
            margin: 0 auto 25px auto;
            width: fit-content;
            border: 1px solid var(--border);
        }
        .avatar-circle {
            width: 24px; height: 24px; background: var(--primary); color: #000;
            border-radius: 50%; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .email-text { font-size: 0.85rem; color: #ddd; }

        /* --- SPINNER --- */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- NOTIFICATION --- */
        .toast {
            position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9);
            color: white; padding: 10px 20px; border-radius: 50px;
            font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none; white-space: nowrap;
        }
        .toast.show { bottom: 20px; opacity: 1; }

    </style>
</head>
<body>

    <div class="ambient-light"></div>
    <div class="grid-overlay"></div>

    <div class="login-container">
        <div class="card" id="mainCard">
            
            <div class="header">
                <div class="logo-ring"><i class="fas fa-bolt"></i></div>
                <h1>Admin Portal</h1>
                <p class="subtitle" id="timeGreeting">Welcome back</p>
            </div>

            <form onsubmit="return false;">
                <div class="form-slider">
                    
                    <!-- SLIDE 1: EMAIL -->
                    <div id="slide1" class="slide active">
                        <div class="input-box">
                            <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                        <button type="button" class="btn-primary" id="nextBtn">
                            Continue <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>

                    <!-- SLIDE 2: PASSWORD -->
                    <div id="slide2" class="slide">
                        <div class="user-chip">
                            <div class="avatar-circle" id="userInitial">A</div>
                            <span class="email-text" id="displayEmail">admin@example.com</span>
                        </div>

                        <div class="input-box">
                            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                            <i class="fas fa-lock"></i>
                        </div>

                        <button type="submit" class="btn-primary" id="loginBtn">
                            <span class="btn-txt">Access Dashboard</span>
                            <div class="spinner"></div>
                        </button>

                        <button type="button" class="btn-link" id="backBtn">
                            Not you? Switch account
                        </button>
                    </div>

                </div>
            </form>
        </div>
        
        <div id="toast" class="toast">Invalid Credentials</div>
    </div>

    <script>
        const pb = new PocketBase('https://db.streamzonemovies.online');

        // Initial Check
        if (pb.authStore.isValid) { window.location.href = 'index.html'; }

        // Dynamic Greeting
        const hour = new Date().getHours();
        const msg = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
        document.getElementById('timeGreeting').innerText = msg + ", Admin";

        // Elements
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const loginBtn = document.getElementById('loginBtn');
        const card = document.getElementById('mainCard');
        const toast = document.getElementById('toast');

        // Functions
        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            card.classList.add('shake');
            setTimeout(() => {
                toast.classList.remove('show');
                card.classList.remove('shake');
            }, 2000);
        }

        function goToStep2() {
            if (!emailInput.value.includes('@') || emailInput.value.length < 5) {
                showToast("Please enter a valid email");
                emailInput.focus();
                return;
            }
            
            // Set User Chip Data
            document.getElementById('displayEmail').innerText = emailInput.value;
            document.getElementById('userInitial').innerText = emailInput.value.charAt(0).toUpperCase();

            slide1.classList.remove('active');
            slide1.classList.add('prev');
            slide2.classList.add('active');
            
            setTimeout(() => passInput.focus(), 400);
        }

        function goToStep1() {
            slide2.classList.remove('active');
            slide1.classList.remove('prev');
            slide1.classList.add('active');
            passInput.value = ''; // Security clear
            setTimeout(() => emailInput.focus(), 400);
        }

        async function attemptLogin() {
            if (!passInput.value) {
                showToast("Password is required");
                return;
            }

            // Loading State
            const btnTxt = loginBtn.querySelector('.btn-txt');
            const spinner = loginBtn.querySelector('.spinner');
            btnTxt.style.display = 'none';
            spinner.style.display = 'block';
            loginBtn.disabled = true;

            try {
                // This now targets /api/admins/auth-with-password correctly
                await pb.admins.authWithPassword(emailInput.value, passInput.value);
                
                // Success: Set security timestamp
                localStorage.setItem('adminLoginTime', Date.now());
                
                // Smooth Fade Out
                document.body.style.transition = "opacity 0.5s";
                document.body.style.opacity = "0";
                
                setTimeout(() => window.location.href = 'index.html', 500);

            } catch (err) {
                console.error(err);
                showToast("Access Denied. Try again.");
                btnTxt.style.display = 'block';
                spinner.style.display = 'none';
                loginBtn.disabled = false;
                passInput.value = '';
                passInput.focus();
            }
        }

        // Event Listeners
        nextBtn.addEventListener('click', goToStep2);
        backBtn.addEventListener('click', goToStep1);
        loginBtn.addEventListener('click', attemptLogin);

        // Enter Key Logic
        emailInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') goToStep2(); });
        passInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptLogin(); });

    </script>
</body>
</html>
